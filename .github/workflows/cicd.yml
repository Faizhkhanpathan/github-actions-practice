
name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    name: Code Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Verify Code
        run: echo "Code cloned successfully"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Build using Docker
        run: echo "Building Docker Image"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Tests
        run: echo "Testing the Application"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy Application
        run: echo "Deploying the Application"
